<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #1e293b;
    }

    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 15%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 70%; right: 10%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; bottom: 15%; left: 25%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-text {
      font-size: 0.95rem;
      color: #475569;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .upload-form {
      display: grid;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-weight: 500;
      font-size: 0.95rem;
      color: #334155;
    }

    .file-input {
      padding: 1rem;
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      background: #f9fafb;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      position: relative;
    }

    .file-input:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .file-input input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .select-input {
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
      background: white;
      transition: all 0.2s;
    }

    .select-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
      outline: none;
    }

    .submit-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #2563eb;
    }

    .submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .image-grid {
      display: grid;
      gap: 2rem;
    }

    .image-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
    }

    .image-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .image-container {
      text-align: center;
    }

    .image-container h4 {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .image-container img {
      max-width: 150px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .status-done { background: #dcfce7; color: #166534; }
    .status-processing { background: #fef3c7; color: #92400e; }
    .status-failed { background: #fee2e2; color: #dc2626; }

    .option-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .empty-state, .loading {
      text-align: center;
      color: #64748b;
      font-style: italic;
      padding: 2rem;
    }

    @media (max-width: 640px) {
      .header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .image-comparison {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <div class="header">
      <div>
        <h1>Dashboard</h1>
        <p class="welcome-text">Welcome, {{ email }}</p>
      </div>
      <a href="/logout" class="logout-btn">Sign Out</a>
    </div>

    <div class="card">
      <h2>Upload New Images</h2>
      <form method="post" action="/upload" enctype="multipart/form-data" class="upload-form">
        <div class="form-group">
          <label for="fileInput">Select Images</label>
          <div class="file-input">
            <input type="file" id="fileInput" name="files" multiple accept="image/*" onchange="validateFiles(this)">
            <span>Click to choose files or drag and drop</span>
          </div>
        </div>

        <div class="form-group">
          <label for="option">Processing Option</label>
          <select name="option" id="option" class="select-input" required>
            <option value="">Choose an option</option>
            <option value="light">Light Processing</option>
            <option value="heavy">Heavy Processing</option>
            <option value="both">Both Options</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Upload & Process</button>
      </form>
    </div>

    <div class="card">
      <h2>Your Images</h2>
      <div id="image-list" class="image-grid">
        <div class="loading">Loading images...</div>
      </div>
    </div>
  </div>

 
    <script>
        function validateFiles(input) {
            const maxSize = 10 * 1024 * 1024; // 10MB
            const fileSpan = input.parentElement.querySelector('span');
            
            if (input.files.length === 0) {
                fileSpan.textContent = 'Click to choose files or drag and drop';
                return;
            }

            for (let file of input.files) {
                if (file.size > maxSize) {
                    alert(`File "${file.name}" exceeds 10MB limit.`);
                    input.value = "";
                    fileSpan.textContent = 'Click to choose files or drag and drop';
                    return;
                }
            }

            const fileCount = input.files.length;
            fileSpan.textContent = `${fileCount} file${fileCount > 1 ? 's' : ''} selected`;
        }

        async function loadImages() {
            const container = document.getElementById("image-list");
            
            try {
                const res = await fetch("/api/images");
                if (!res.ok) throw new Error("Failed to fetch images");

                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="empty-state">No uploads yet. Upload your first image above!</div>';
                    return;
                }

                container.innerHTML = data.map(img => `
                    <div class="image-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <span class="status-badge status-${img.status}">${img.status}</span>
                            <span class="option-tag">${img.option_selected}</span>
                        </div>

                        <div class="image-comparison">
                            <div class="image-container">
                                <h4>Original</h4>
                                <img src="${img.original_path}" alt="Original image" onerror="this.style.display='none'">
                            </div>
                            
                            ${img.status === "done" && img.processed_path ? `
                                <div class="image-container">
                                    <h4>Processed - Click Image to View/Download</h4>
                                    <a href="${img.processed_path}" download target="_blank">
                                        <img src="${img.processed_path}" alt="Processed image" onerror="this.style.display='none'" />
                                    </a>
                                </div>
                            ` : `
                                <div class="image-container">
                                    <h4>Processed</h4>
                                    <div style="width: 150px; height: 100px; background: #f1f5f9; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.8rem; margin: 0 auto;">
                                        ${img.status === "processing" ? "Processing..." : img.status === "failed" ? "Failed" : "Pending"}
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                `).join("");
                
            } catch (err) {
                console.error("Failed to load images:", err);
                container.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 2rem;">Failed to load images. Please refresh the page.</div>';
            }
        }

        // Load images initially and refresh every 10 seconds
        loadImages();
        setInterval(loadImages, 10000);

        // File input drag and drop enhancement
        const fileInput = document.getElementById('fileInput');
        const fileInputContainer = fileInput.parentElement;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileInputContainer.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileInputContainer.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileInputContainer.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            fileInputContainer.style.borderColor = '#3b82f6';
            fileInputContainer.style.background = '#eff6ff';
        }

        function unhighlight(e) {
            fileInputContainer.style.borderColor = '#d1d5db';
            fileInputContainer.style.background = '#f9fafb';
        }

        fileInputContainer.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            validateFiles(fileInput);
        }
    </script>

</body>
</html>
