services:
  - type: web
    name: picfilter-fastapi
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SUPABASE_URL
        value: your_supabase_url
      - key: SUPABASE_KEY
        value: your_supabase_key
      - key: BUCKET_NAME
        value: your_bucket_name
      - key: REDIS_URL
        value: your_redis_url

  - type: worker
    name: picfilter-celery-worker
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery_app worker --loglevel=info
    envVars:
      - key: SUPABASE_URL
        value: your_supabase_url
      - key: SUPABASE_KEY
        value: your_supabase_key
      - key: BUCKET_NAME
        value: your_bucket_name
      - key: REDIS_URL
        value: your_redis_url